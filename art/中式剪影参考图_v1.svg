<text x="898" y="700" font-size="11" font-weight="700" fill="#23262e">④ 碎石坡 → 泥沼：水汽柱带</text>
<text x="898" y="718" font-size="9" fill="#6a6f78">实心细竖柱阵列（宽6/间距14/高度抖动）</text>

<text x="640" y="834" font-size="11" font-weight="700" fill="#b84c46">⚠ 纯剪影纪律：全图 0 处半透（半透 = 渐变 = 违反定义）。层次一律靠「高度分层 / 形状 / 疏密」，不靠 alpha</text>
<text x="640" y="854" font-size="11" fill="#23262e">裁剪口径：复用 `_draw_world_height()` 的 vis_r，往上扩 max_sil_h；成片分段 ≤256；按包围盒 AABB，不按格</text>
<text x="640" y="868" font-size="11" fill="#b84c46">层级：画在 `Game._draw()` 内（父节点 `_draw()` 先于子节点 ⇒ 永远在实体之下 ⇒ 永不遮人、永不丢敌情）；不走 FgLayer（原 `_draw_ridges()` 已随云/远山一并删除）。⚠ **2026-10-18 用户改方向「先不做美术」⇒ 本档停工、代码未提交**（备份：`桌面/_yl_F10_主城剪影_半成品.patch` + git stash）</text>
<text x="640" y="876" font-size="10" fill="#6a6f78">开关：F10 独立、默认 off；FgLayer 复用（节点），F9/F10 各判自己 flag —— 不许合并</text>
<text x="640" y="894" font-size="10" fill="#6a6f78">判不准：秘境 6 座坐标待同心层落位 · 玄甲印去向待用户定 · 云/远山顺序待抓帧</text>
<text x="640" y="910" font-size="10" fill="#b84c46">⚠ B 档（野外）双重依赖：①「南向裙边」落地（判据 = 单条最大暗缝高 ≤32）② 同心层落地（现 ZONES 仍是四象限）</text>
</svg>
