<path d="M106,670 Q134,694 148,700 Q196,696 244,634 Q292,696 340,700 Q354,694 382,670 L382,682 Q354,706 340,712 Q292,708 244,648 Q196,708 148,712 Q134,706 106,682 Z" fill="#23262e"/>
