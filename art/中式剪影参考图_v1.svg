<line x1="106" y1="666" x2="148" y2="666" stroke="#b84c46"/>
<text x="60" y="662" font-size="10" fill="#b84c46">挑出 14</text>
<line x1="148" y1="640" x2="244" y2="640" stroke="#b84c46" stroke-dasharray="4 3"/>
<text x="150" y="634" font-size="10" fill="#b84c46">脊高 h_ridge = h_eave + 22</text>
<line x1="106" y1="670" x2="106" y2="700" stroke="#3f7a5a"/>
<text x="60" y="690" font-size="10" fill="#3f7a5a">起翘 10</text>
<text x="106" y="726" font-size="10" fill="#6a6f78">檐口 h_eave</text>
<text x="400" y="600" font-size="11" fill="#23262e">屋面控制点下压 6</text>
<text x="400" y="618" font-size="11" fill="#23262e">= 反宇凹曲面（不是直线坡）</text>
<text x="400" y="642" font-size="11" fill="#23262e">w = 56 / 64 / 72</text>
<text x="400" y="660" font-size="11" fill="#23262e">h_eave = 48 / 54 / 60 / 66 / 72</text>
<text x="400" y="684" font-size="10" fill="#6a6f78">抖动：w = 56+(i·53%3)·8</text>
<text x="400" y="702" font-size="10" fill="#6a6f78">h_eave = 48+(i·37%5)·6</text>
<text x="400" y="726" font-size="10" fill="#6a6f78">→ 20 个开间同一函数、只换 (w, h_eave, i)</text>
<text x="60" y="906" font-size="10" fill="#6a6f78">色 Color(0.16,0.18,0.24,0.92) + 2px 勾边 (0.10,0.12,0.16,0.90)</text>

<!-- ============ D 野外四域：同色不同形 ============ -->
<rect x="620" y="490" width="520" height="430" fill="#ffffff" stroke="#c9c5bc"/>
<text x="632" y="512" font-size="14" font-weight="700" fill="#23262e">D · 野外四域「界感」—— 同色不同形（成片，不成点）</text>
<text x="632" y="532" font-size="11" fill="#b84c46">⭐ 剪影标在「域的边界带」上，不在域内撒 —— 界感字面成立，且数量随周长增长、不随面积增长</text>

