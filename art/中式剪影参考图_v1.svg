<text x="1010" y="198" font-size="9" fill="#8a6a6a">（H=174 时须 ≤18，站不进去 ⇒ 已砍）</text>

<!-- ============ C 飞檐模块曲线 ============ -->
<rect x="40" y="490" width="560" height="430" fill="#ffffff" stroke="#c9c5bc"/>
